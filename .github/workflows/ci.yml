name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The tool reads local session files and registers a startup entry per platform, so the checks
    # run everywhere it claims to work rather than on Linux alone.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  install:
    # The checks above prove the code runs. This proves the published artifact installs and works
    # the way a user gets it: pack the tarball, install it globally, run the binary off PATH.
    # Windows exercises the npm-generated shim rather than the symlink the other two get.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pack and install globally
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP/tikr-$(node -p "require('./package.json').version").tgz"

      - name: Run the installed binary
        shell: bash
        # An empty data directory is the fresh-install case: every command must work and exit 0
        # rather than depending on the developer's own transcripts.
        env:
          TIKR_HOME: ${{ runner.temp }}/counter-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-home
        run: |
          set -euo pipefail
          mkdir -p "$CLAUDE_CONFIG_DIR/projects"
          tikr --version
          tikr providers
          tikr scan --verbose
          tikr stats --no-scan
          tikr status
          echo '{"model":{"display_name":"CI"}}' | tikr statusline
          tikr statusline --install
          test -f "$TIKR_HOME/state.json"
