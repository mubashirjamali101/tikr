name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.actor != 'dependabot[bot]'
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest 3 / rolldown need Node 20+. One OS is enough for unit tests.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  install:
    if: github.actor != 'dependabot[bot]'
    # Proves the packed tarball installs and runs on each platform a user might use.
    # One node version; the matrix above already covers engines.
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pack and install globally
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP/tikr-$(node -p "require('./package.json').version").tgz"

      - name: Run the installed binary
        shell: bash
        # An empty data directory is the fresh-install case: every command must work and exit 0
        # rather than depending on the developer's own transcripts.
        env:
          TIKR_HOME: ${{ runner.temp }}/counter-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-home
        run: |
          set -euo pipefail
          mkdir -p "$CLAUDE_CONFIG_DIR/projects"
          tikr --version
          tikr providers
          tikr scan --verbose
          tikr stats --no-scan
          tikr status
          echo '{"model":{"display_name":"CI"}}' | tikr statusline
          tikr statusline --install
          test -f "$TIKR_HOME/state.json"

  dependabot:
    if: github.actor == 'dependabot[bot]'
    name: dependabot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
